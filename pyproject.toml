[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "discord-translate-overlay"
version = "0.1.0"
description = "Nude Translator for Discord (Windows; macOS foundation included)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "GPL-3.0-only"
dependencies = [
  "comtypes>=1.4,<2; sys_platform == 'win32'",
  "dxcam==0.3.0; sys_platform == 'win32'",
  "httpx>=0.28,<1",
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<5",
  "Pillow>=11,<13",
  "platformdirs>=4.3,<5",
  "psutil>=7,<8",
  "PySide6>=6.9,<7",
  "pywin32>=310; sys_platform == 'win32'",
  "websocket-client>=1.8,<2",
]

[project.optional-dependencies]
ocr-cpu = [
  "paddleocr==3.7.0; sys_platform == 'win32'",
  "paddlepaddle==3.3.1; sys_platform == 'win32'",
]
ocr-gpu = [
  "nvidia-cublas-cu12==12.9.2.10; sys_platform == 'win32'",
  "nvidia-cuda-nvrtc-cu12==12.9.86; sys_platform == 'win32'",
  "nvidia-cuda-runtime-cu12==12.9.79; sys_platform == 'win32'",
  "nvidia-cudnn-cu12==9.24.0.43; sys_platform == 'win32'",
  "paddleocr==3.7.0; sys_platform == 'win32'",
  "paddlepaddle-gpu==3.3.1; sys_platform == 'win32'",
]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
  "pyinstaller>=6.14,<7",
]

[project.scripts]
discord-translate-overlay = "discord_translate_overlay.app:main"
discord-translate-poc = "discord_translate_overlay.poc:main"
nude-translator-dom = "discord_translate_overlay.experimental_dom.controller:main"
nude-translator-engine = "discord_translate_overlay.sidecar:main"

[tool.hatch.build.targets.wheel]
packages = ["src/discord_translate_overlay"]

[tool.uv]
environments = ["sys_platform == 'win32'", "sys_platform == 'darwin'"]
conflicts = [
  [
    { extra = "ocr-cpu" },
    { extra = "ocr-gpu" },
  ],
]

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddle-cu129" }

[[tool.uv.index]]
name = "paddle-cu129"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu129/"
explicit = true


[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
