[package]
name = "nude-translator-tauri"
version = "0.4.6-beta"
description = "NudeNyang Translator Tauri desktop shell"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/NudeNyang/NudeNyang-Translator"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ab_glyph = "0.2"
base64 = "0.22"
encoding_rs = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
imageproc = "0.25"
keyring = "4.1"
ocr-rs = { path = "../vendor/ocr-rs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.33"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
unicode-normalization = "0.1"
url = "2"
tungstenite = "0.26"
time = { version = "0.3", features = ["formatting"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
