<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NudeNyang Web Translator</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <div class="heading">
        <div>
          <p class="eyebrow">NUDENYANG</p>
          <h1 data-i18n="globalWebTranslation">전체 웹 번역</h1>
        </div>
        <label class="switch" aria-label="웹페이지 번역 사용" data-i18n-aria-label="globalWebTranslation">
          <input id="enabled" type="checkbox">
          <span></span>
        </label>
      </div>
      <p id="site" class="site" data-i18n="checking">확인 중</p>
      <div id="connection" class="connection waiting">
        <span class="dot"></span>
        <span id="connection-text" data-i18n="connecting">엔진 연결 중</span>
      </div>
      <p id="detail" class="detail"></p>
      <section id="companion-panel" class="companion-panel" aria-labelledby="companion-title" hidden>
        <div class="companion-heading">
          <h2 id="companion-title" data-i18n="connectionRequired">연결 필요</h2>
          <button id="companion-dismiss" class="text-action" type="button" data-i18n="close">닫기</button>
        </div>
        <p id="companion-description"></p>
        <div class="companion-actions">
          <button id="companion-download" class="messenger-consent-action" type="button" data-i18n="windowsDownload">Windows 앱 다운로드</button>
          <button id="companion-retry" type="button" data-i18n="checkConnection">연결 확인</button>
        </div>
        <details id="companion-troubleshooting">
          <summary data-i18n="connectionHelp">연결 도움말</summary>
          <p data-i18n="companionRecovery"></p>
        </details>
      </section>
      <button id="companion-help" class="text-action" type="button" data-i18n="connectionHelp" hidden>연결 도움말</button>
      <div id="messenger-panel" class="messenger-panel" hidden>
        <h2 id="messenger-title" data-i18n="messengerPrivacyConsent" hidden>웹 메신저 개인정보 동의</h2>
        <p id="messenger-notice" class="messenger-notice" role="status" aria-live="polite" hidden></p>
        <button id="messenger-consent-start" class="messenger-consent-action" type="button" hidden>개인정보 안내 확인</button>
      </div>
      <div class="quick-controls">
        <div class="quick-select-row">
          <span data-i18n="translationLanguage">번역 언어</span>
          <div id="target-language" class="language-picker">
            <button id="target-language-trigger" class="language-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
              <span id="target-language-label" data-i18n="defaultTranslationLanguage">기본 번역 언어</span>
            </button>
            <div id="target-language-menu" class="language-menu" hidden>
              <div class="language-search-shell">
                <input id="target-language-search" class="language-search" type="search" placeholder="언어 검색" aria-label="언어 검색" data-i18n-placeholder="searchLanguage" data-i18n-aria-label="searchLanguage" autocomplete="off">
              </div>
              <div id="target-language-options" class="language-options" role="listbox" aria-label="번역 언어" data-i18n-aria-label="translationLanguage"></div>
              <p id="target-language-empty" class="language-empty" data-i18n="noSearchResults" hidden>검색 결과가 없습니다.</p>
            </div>
          </div>
        </div>
      </div>
      <p id="usage" class="usage">번역 0 · 전송 0</p>
      <div class="shortcut-row" aria-label="번역 / 원문">
        <span class="shortcut-label"><span data-i18n="translation">번역</span> / <span data-i18n="original">원문</span></span>
        <span class="shortcut-keys">
          <kbd class="primary-key" id="quick-toggle-shortcut">F4</kbd>
          <span class="shortcut-or">/</span>
          <kbd id="command-shortcut">Ctrl + Shift + L</kbd>
        </span>
      </div>
      <div class="footer-actions">
        <button id="open-settings" class="secondary-action" type="button"><span data-i18n="webTranslation">웹 번역</span> <span data-i18n="settings">설정</span></button>
        <button id="messenger-privacy" class="privacy-action" type="button" data-i18n="reviewMessengerPrivacy">개인정보 안내 확인</button>
      </div>
    </main>
    <script src="content-helpers.js"></script>
    <script src="popup-locales.js"></script>
    <script src="connection-guidance.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
