<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NudeNyang Web Translator</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <div class="heading">
        <div>
          <p class="eyebrow">NUDENYANG</p>
          <h1>웹페이지 번역</h1>
        </div>
        <label class="switch" aria-label="웹페이지 번역 사용">
          <input id="enabled" type="checkbox">
          <span></span>
        </label>
      </div>
      <p id="site" class="site">지원 사이트를 확인하고 있습니다.</p>
      <div id="connection" class="connection waiting">
        <span class="dot"></span>
        <span id="connection-text">Windows 앱에 연결하는 중입니다…</span>
      </div>
      <p id="detail" class="detail"></p>
      <div class="quick-controls">
        <div class="quick-select-row">
          <span>현재 페이지 언어</span>
          <div id="target-language" class="language-picker">
            <button id="target-language-trigger" class="language-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
              <span id="target-language-label">앱 설정 따르기</span>
            </button>
            <div id="target-language-menu" class="language-menu" hidden>
              <div class="language-search-shell">
                <input id="target-language-search" class="language-search" type="search" placeholder="언어 검색" aria-label="언어 검색" autocomplete="off">
              </div>
              <div id="target-language-options" class="language-options" role="listbox" aria-label="현재 페이지 언어"></div>
              <p id="target-language-empty" class="language-empty" hidden>일치하는 언어가 없습니다.</p>
            </div>
          </div>
        </div>
        <label class="quick-switch-row">
          <span>이 사이트 항상 번역</span>
          <span class="switch compact-switch">
            <input id="always-translate-site" type="checkbox">
            <span></span>
          </span>
        </label>
      </div>
      <p id="usage" class="usage">이 페이지 요청 0회 · 전송 0자</p>
      <div class="shortcut-row" aria-label="번역과 원문을 전환하는 단축키">
        <span class="shortcut-label">번역/원문 전환</span>
        <span class="shortcut-keys">
          <kbd class="primary-key">F4</kbd>
          <span class="shortcut-or">또는</span>
          <kbd id="command-shortcut">Ctrl + Shift + L</kbd>
        </span>
      </div>
      <button id="restore" type="button">이 페이지 원문으로 복원</button>
      <button id="open-settings" class="secondary-action" type="button">웹 번역 설정 열기</button>
    </main>
    <script src="content-helpers.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
